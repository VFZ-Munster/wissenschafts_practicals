<!--
  Classroom polls & on-demand practice quizzes.
  Turns every `::: {.poll #some-id}` block into an interactive poll/quiz.
  - Live Classroom Mode: students vote during lecture; results & explanations appear once presenter reveals them.
  - Practice Mode: students test themselves on-demand after class with instant feedback, zero database writes.
  - Presenter Toolbar: in-page banner on each practical + floating ⚙ in navbar for mode switching, reveals, resets, and CSV export.
  Database setup: see supabase/schema.sql and supabase/README.md.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  // Fill these in from Supabase: Project Settings -> API.
  const SUPABASE_URL = "https://ztjjlogcdhynfkifaqtp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0ampsb2djZGh5bmZraWZhcXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MTg0NjksImV4cCI6MjEwODM5NDQ2OX0.RsKffHoPL-wn-lKgoBW-K4xKKLiZVC8HMUWdUWhLIG8";
  const REFRESH_MS = 4000;

  const cards = Array.from(document.querySelectorAll("div.poll[id]"));
  const tableEls = Array.from(document.querySelectorAll("div.poll-table[id]"));
  const calcEls = Array.from(document.querySelectorAll("div.poll-calc[id]"));

  // Canonical session ID for this page: derived from the poll prefix (e.g. "p2") or page filename
  const firstPoll = (cards[0] || tableEls[0] || calcEls[0] || {}).id || "";
  const pollPrefix = firstPoll ? firstPoll.split("-")[0] : "";
  const pathParts = location.pathname.split("/").filter(Boolean);
  const pageSlug = (pathParts[pathParts.length - 1] || "index").replace(/\.(html|qmd)$/, "");
  const pageSessionId = "session-" + (pollPrefix || pageSlug);

  function getPracticalLabel() {
    const h1 = document.querySelector("#quarto-document-content h1") || document.querySelector("h1");
    const text = h1 ? h1.textContent.trim() : "";
    const m = text.match(/Practical\s*(\d+)/i) || text.match(/Praktikum\s*(\d+)/i) || document.title.match(/praktikum\s*(\d+)/i);
    if (m) return { full: "Practical " + m[1], short: "P" + m[1], num: m[1] };
    if (pollPrefix && /^p\d+/i.test(pollPrefix)) {
      const num = pollPrefix.replace(/\D/g, "");
      return { full: "Practical " + num, short: "P" + num, num };
    }
    return { full: pageSlug, short: pageSlug, num: "" };
  }

  let teacher = false;
  let practiceMode = false;
  let previewAsStudent = false;
  let praktikumBar = null;

  const T = {
    votes: n => n === 1 ? "1 vote" : n + " votes",
    saved: "Vote saved – results appear once they are revealed.",
    hidden: "Only you can see this – students don't see the results yet.",
    revealedToAll: "Results are revealed to everyone.",
    yours: "your answer", correct: "correct", why: "Why?", kicker: "Live poll",
    kickerPractice: "Practice / Self-Check",
    kickerTable: "Fill in the table", kickerTablePractice: "Practice Table",
    kickerCalc: "Calculate", kickerCalcPractice: "Practice Calculation",
    submit: "Submit", update: "Update answer",
    checkAnswer: "Check answer", checkAnswers: "Check answers",
    tryAgain: "↺ Try again",
    correctBadge: "Correct", incorrectBadge: "Incorrect",
    yourAnswerCorrect: "your answer · Correct ✓",
    yourAnswerWrong: "your answer · Incorrect ✗",
    classBenchmark: n => "Class results (" + (n === 1 ? "1 vote" : n + " votes") + " in lecture)",
    promptPractice: "Select your answer to test yourself.",
    promptTablePractice: "Fill in the blanks and check your answers.",
    promptCalcPractice: "Enter your calculated values and check your answers.",
    fillAll: "Please fill in all empty cells.", allCorrect: "All correct",
    submissions: n => n === 1 ? "1 submission" : n + " submissions",
    selectAll: "Select all that apply.", exact: "Exactly right",
    partiallyCorrect: "Partially correct",
    savedTable: "Answer saved – the solution appears once it is revealed.",
    fillNumbers: "Please enter a number in every field.", other: "Other answer",
    reveal: "Reveal results", hide: "Hide results", reset: "Reset (new round)",
    confirmReset: "Start a new round? Votes from the current round are kept in the CSV export.",
    notConfigured: "Poll not set up yet.",
    error: "Connection failed – please try again.",
    presenter: "Presenter mode", login: "Log in", logout: "Log out", csv: "Votes as CSV",
    email: "E-mail", password: "Password", notTeacher: "This account is not registered as a teacher.",
    openPractice: "Open Practice Mode for Students",
    switchLive: "Switch to Live Classroom",
    resetAll: "↺ Reset all polls on this page",
    confirmResetAll: "Reset all polls on this page for a new class? Previous votes remain archived in the CSV export.",
    previewStudent: "Preview as student",
    practiceActiveNotice: "Practice Mode Active",
    setToPractice: "Set to Practice",
    setToLive: "Set to Live"
  };

  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let voter = store.get("poll-voter", null);
  if (!voter) {
    voter = (crypto.randomUUID ? crypto.randomUUID() :
      "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));
    store.set("poll-voter", voter);
  }

  const myVotes = store.get("poll-votes", {});
  const practiceVotes = store.get("poll-practice-votes", {});

  // Read question, options, correct answers (correct="1,3", 1-based) and the
  // .poll-explanation block from the markdown, then rebuild the card.
  const polls = cards.map(el => {
    const items = Array.from(el.querySelectorAll(":scope > ul > li"));
    const explanation = el.querySelector(":scope > .poll-explanation");
    const p = {
      id: el.id, el, options: items.map(li => li.innerHTML),
      correct: (el.dataset.correct || "").split(",").filter(x => x.trim()).map(x => +x - 1),
      multiple: (el.dataset.multiple || el.getAttribute("multiple")) === "true",
      state: { round: 1, revealed: false, counts: null, total: 0 }
    };
    const question = document.createElement("div");
    question.className = "poll-question";
    Array.from(el.children).filter(c => c.tagName !== "UL" && c !== explanation).forEach(c => question.append(c));
    el.innerHTML = '<div class="poll-body"></div>' +
      '<div class="poll-footer"><span class="poll-status"></span><span class="poll-controls"></span></div>';
    el.prepend(question);
    el.insertAdjacentHTML("afterbegin", '<div class="poll-kicker"><span class="poll-dot"></span>' + T.kicker + '</div>');
    if (explanation) {
      explanation.hidden = true;
      explanation.insertAdjacentHTML("afterbegin", '<div class="poll-why">💡 ' + T.why + '</div>');
      el.querySelector(".poll-body").after(explanation);
    }
    p.explanation = explanation;
    if (p.multiple) question.insertAdjacentHTML("beforeend", '<div class="poll-hint-multi">' + T.selectAll + '</div>');
    return p;
  });

  // Fill-in tables: cells written as [199]{.blank} become inputs; the last row
  // and last column are totals computed live.
  const num = v => { const d = String(v).replace(/[^\d-]/g, ""); return d === "" ? null : +d; };
  const fmt = n => n.toLocaleString("en-US");
  const plain = el => el.textContent.trim();
  const tables = tableEls.map(el => {
    const rows = Array.from(el.querySelector("table").rows);
    const header = rows[0], body = rows.slice(1);
    const t = { id: el.id, el, blanks: [], state: { round: 1, revealed: false, counts: null, total: 0 }, subs: {} };
    body.forEach(tr => Array.from(tr.cells).forEach((td, c) => {
      const span = td.querySelector(".blank");
      if (!span) return;
      const input = document.createElement("input");
      input.type = "text"; input.inputMode = "numeric"; input.autocomplete = "off"; input.className = "poll-input";
      const label = plain(tr.cells[0]) + " × " + plain(header.cells[c]);
      input.setAttribute("aria-label", label);
      const hint = document.createElement("span");
      hint.className = "poll-hint";
      td.textContent = ""; td.append(input, hint);
      t.blanks.push({ id: el.id + "-" + (t.blanks.length + 1), answer: num(span.textContent), input, hint, label });
    }));
    el.querySelector("table").classList.add("poll-grid");
    body[body.length - 1].classList.add("poll-total-row");
    rows.forEach(tr => tr.cells[tr.cells.length - 1].classList.add("poll-total-col"));

    const value = td => { const i = td.querySelector("input"); return num(i ? i.value : td.textContent); };
    t.updateTotals = () => {
      const data = body.slice(0, -1), last = header.cells.length - 1;
      const sum = cells => cells.some(v => v === null) ? null : cells.reduce((a, b) => a + b, 0);
      const grid = data.map(tr => Array.from(tr.cells).slice(1, last).map(value));
      const show = (td, v) => { td.textContent = v === null ? "…" : fmt(v); };
      data.forEach((tr, r) => show(tr.cells[last], sum(grid[r])));
      const totalRow = body[body.length - 1];
      for (let c = 0; c < last - 1; c++) show(totalRow.cells[c + 1], sum(grid.map(g => g[c])));
      show(totalRow.cells[last], sum(grid.map(sum)));
    };
    t.blanks.forEach(b => b.input.addEventListener("input", t.updateTotals));
    t.updateTotals();

    el.insertAdjacentHTML("afterbegin", '<div class="poll-kicker"><span class="poll-dot"></span>' + T.kickerTable + '</div>');
    el.insertAdjacentHTML("beforeend",
      '<div class="poll-table-stats" hidden></div>' +
      '<div class="poll-footer"><span class="poll-actions"><button type="button" class="poll-submit"></button>' +
      '<span class="poll-status"></span></span><span class="poll-controls"></span></div>');
    el.classList.add("poll");
    el.querySelector(".poll-submit").onclick = () => submitTable(t);
    return t;
  });
  const tableIds = t => [t.id].concat(t.blanks.map(b => b.id));

  // Calculation cards: each list item [label]{.calc answer="2.19" tol="0.02" unit="%"
  // mistakes="0.46: text | 1.88: text"} becomes a number input.
  const attr = (el, k) => el.getAttribute("data-" + k) ?? el.getAttribute(k);
  const dec = v => { const d = String(v).replace(/[\s%]/g, "").replace(",", "."); return d === "" || isNaN(d) ? null : +d; };
  const calcs = calcEls.map(el => {
    const c = { id: el.id, el, fields: [], state: { round: 1, revealed: false, counts: null, total: 0 }, subs: {} };
    const list = el.querySelector(":scope > ul");
    const grid = document.createElement("div");
    grid.className = "poll-calc-fields";
    Array.from(list.querySelectorAll(":scope > li span.calc")).forEach(span => {
      const f = {
        id: el.id + "-" + (c.fields.length + 1), label: span.innerHTML, text: plain(span),
        answer: +attr(span, "answer"), tol: +(attr(span, "tol") || 0.01), unit: attr(span, "unit") || "",
        mistakes: (attr(span, "mistakes") || "").split("|").map(m => m.trim()).filter(Boolean).map(m => {
          const i = m.indexOf(":");
          return { value: +m.slice(0, i), label: m.slice(i + 1).trim() };
        })
      };
      const box = document.createElement("div");
      box.className = "poll-calc-field";
      box.innerHTML = '<div class="poll-calc-label">' + f.label + '</div><div class="poll-calc-row">' +
        '<input type="text" inputmode="decimal" autocomplete="off" class="poll-input">' +
        (f.unit ? '<span class="poll-calc-unit">' + f.unit + '</span>' : '') + '</div>' +
        '<span class="poll-hint"></span><div class="poll-calc-feedback"></div><div class="poll-calc-stats" hidden></div>';
      f.input = box.querySelector("input");
      f.input.setAttribute("aria-label", f.text);
      f.hint = box.querySelector(".poll-hint");
      f.feedback = box.querySelector(".poll-calc-feedback");
      f.stats = box.querySelector(".poll-calc-stats");
      grid.append(box);
      c.fields.push(f);
    });
    list.replaceWith(grid);
    el.insertAdjacentHTML("afterbegin", '<div class="poll-kicker"><span class="poll-dot"></span>' + T.kickerCalc + '</div>');
    el.insertAdjacentHTML("beforeend",
      '<div class="poll-table-stats" hidden></div>' +
      '<div class="poll-footer"><span class="poll-actions"><button type="button" class="poll-submit"></button>' +
      '<span class="poll-status"></span></span><span class="poll-controls"></span></div>');
    el.classList.add("poll", "poll-table");
    el.querySelector(".poll-submit").onclick = () => submitCalc(c);
    return c;
  });
  const calcIds = c => [c.id].concat(c.fields.map(f => f.id));
  const withUnit = f => f.answer + (f.unit && f.unit !== "%" ? " " : "") + f.unit;

  // Percent fields also accept proportions (0.12 = 12 %).
  function classify(f, raw) {
    let v = dec(raw);
    if (v === null) return null;
    if (f.unit === "%" && Math.abs(v) < 1) v *= 100;
    const near = x => Math.abs(v - x) <= f.tol + 1e-9;
    if (near(f.answer)) return 0;
    const m = f.mistakes.findIndex(m => near(m.value));
    return m >= 0 ? m + 1 : f.mistakes.length + 1;
  }
  const allIds = () => polls.map(p => p.id).concat(...tables.map(tableIds), ...calcs.map(calcIds));

  const configured = SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase;
  if (!configured) {
    polls.forEach(p => { render(p); p.el.querySelector(".poll-status").textContent = T.notConfigured; });
    tables.concat(calcs).forEach(t => { t.el.querySelector(".poll-submit").hidden = true;
      t.el.querySelector(".poll-status").textContent = T.notConfigured; });
    return;
  }
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  polls.concat(tables, calcs).forEach(p => p.el.classList.add("poll-live"));

  function mine(p) {
    const v = myVotes[p.id];
    return v && v.round === p.state.round ? v.choice : null;
  }

  function render(p) {
    const body = p.el.querySelector(".poll-body");
    const status = p.el.querySelector(".poll-status");
    const controls = p.el.querySelector(".poll-controls");
    const kicker = p.el.querySelector(".poll-kicker");
    const s = p.state, my = mine(p);
    const isTeacher = teacher && !previewAsStudent;

    // Kicker & card styling
    if (kicker) {
      if (practiceMode) {
        kicker.className = "poll-kicker poll-kicker-practice";
        kicker.innerHTML = '<span class="poll-dot"></span>' + T.kickerPractice;
        p.el.classList.add("poll-practice");
      } else {
        kicker.className = "poll-kicker";
        kicker.innerHTML = '<span class="poll-dot"></span>' + T.kicker;
        p.el.classList.remove("poll-practice");
      }
    }

    // Practice status check
    const pVote = practiceVotes[p.id];
    const hasRetried = pVote && pVote.retry;
    const liveChoice = (my !== null && !hasRetried) ? my : null;
    const effectiveChoice = (pVote && pVote.choice !== undefined) ? pVote.choice : liveChoice;
    const isPracticed = effectiveChoice !== null;

    const letter = i => '<span class="poll-letter">' + String.fromCharCode(65 + i) + '</span>';
    const correctMask = p.correct.reduce((m, i) => m | (1 << i), 0);

    if (practiceMode) {
      // =======================================================================
      // PRACTICE / SELF-STUDY MODE (Interactive on-demand self-tests)
      // =======================================================================
      if (isPracticed) {
        p.el.classList.add("poll-revealed");
        if (p.explanation) p.explanation.hidden = false;

        const hasClassVotes = s.total > 0 && s.counts;

        body.innerHTML = p.options.map((label, i) => {
          const isPicked = p.multiple ? !!(effectiveChoice & (1 << i)) : i === effectiveChoice;
          const isCorrect = p.correct.includes(i);
          let barClass = "poll-bar";
          let chipHtml = "";
          let letterHtml = letter(i);

          if (isPicked && isCorrect) {
            barClass += " poll-correct poll-mine";
            letterHtml = '<span class="poll-letter">✓</span>';
            chipHtml = '<span class="poll-chip poll-chip-correct">' + T.yourAnswerCorrect + '</span>';
          } else if (isPicked && !isCorrect) {
            barClass += " poll-wrong poll-mine";
            letterHtml = '<span class="poll-letter">✗</span>';
            chipHtml = '<span class="poll-chip poll-chip-wrong">' + T.yourAnswerWrong + '</span>';
          } else if (!isPicked && isCorrect) {
            barClass += " poll-correct";
            letterHtml = '<span class="poll-letter">✓</span>';
            chipHtml = '<span class="poll-chip poll-chip-correct">' + T.correctBadge + '</span>';
          }

          const n = hasClassVotes
            ? (p.multiple
                ? Object.entries(s.counts).reduce((a, [mask, c]) => a + (mask & (1 << i) ? c : 0), 0)
                : s.counts[i] || 0)
            : 0;
          const pct = (hasClassVotes && s.total) ? Math.round(100 * n / s.total) : 0;

          return '<div class="' + barClass + '">' +
            (hasClassVotes ? '<div class="poll-bar-fill" data-w="' + pct + '"></div>' : '') +
            '<div class="poll-bar-label">' + letterHtml +
            '<span class="poll-bar-text">' + label + '</span>' +
            chipHtml + '</div>' +
            (hasClassVotes ? '<div class="poll-bar-value">' + pct + '%<span>' + n + '</span></div>' : '') +
            '</div>';
        }).join("");

        if (hasClassVotes) {
          requestAnimationFrame(() => requestAnimationFrame(() =>
            body.querySelectorAll(".poll-bar-fill").forEach(f => f.style.width = f.dataset.w + "%")));
        }

        let statusHtml = '<span class="poll-chip poll-chip-practice">' + T.practiceActiveNotice + '</span>';
        if (hasClassVotes) {
          statusHtml += ' <span class="poll-count">' + T.classBenchmark(s.total) + '</span>';
        }
        if (p.multiple) {
          const isExact = effectiveChoice === correctMask;
          statusHtml += ' <span class="poll-chip ' + (isExact ? 'poll-chip-correct' : 'poll-chip-wrong') + '">' +
            (isExact ? T.exact : T.partiallyCorrect) + '</span>';
        }
        status.innerHTML = statusHtml;

        controls.innerHTML = "";
        const retryBtn = button(T.tryAgain, () => {
          practiceVotes[p.id] = { retry: true };
          store.set("poll-practice-votes", practiceVotes);
          p.draft = 0;
          p.lastKey = null;
          render(p);
        });
        retryBtn.className = "poll-control poll-btn-retry";
        controls.append(retryBtn);

        // Teacher controls preserved right on the card
        if (isTeacher) {
          controls.append(
            button(T.reset, () => confirm(T.confirmReset) && rpc("reset_poll", { p_poll: p.id }))
          );
        }

      } else {
        // Unanswered question waiting for selection
        p.el.classList.remove("poll-revealed");
        if (p.explanation) p.explanation.hidden = true;

        if (p.multiple && p.draftRound !== s.round) { p.draft = 0; p.draftRound = s.round; }
        const cols = p.options.length === 4 ? 2 : Math.min(p.options.length, 3);
        const selected = i => p.multiple ? !!(p.draft & (1 << i)) : false;

        body.innerHTML = '<div class="poll-options' + (p.multiple ? ' poll-multi' : '') + '" style="--poll-cols:' + cols + '">' +
          p.options.map((label, i) =>
          '<button type="button" class="poll-option' + (selected(i) ? ' poll-selected' : '') +
          '" data-choice="' + i + '">' + letter(i) +
          '<span class="poll-option-label">' + label + '</span>' +
          '<span class="poll-option-indicator" aria-hidden="true">' + (selected(i) ? (p.multiple ? '✓' : '●') : '') + '</span>' +
          '</button>').join("") + '</div>' +
          (p.multiple ? '<button type="button" class="poll-submit"' + (p.draft ? '' : ' disabled') + '>' +
            T.checkAnswer + '</button>' : '');

        body.querySelectorAll(".poll-option").forEach(b => b.onclick = () => {
          const choice = +b.dataset.choice;
          if (!p.multiple) {
            // Evaluated 100% in-browser, no database write
            practiceVotes[p.id] = { choice, time: Date.now() };
            store.set("poll-practice-votes", practiceVotes);
            p.lastKey = null;
            render(p);
            return;
          }
          p.draft ^= 1 << choice;
          render(p);
        });

        const submit = body.querySelector(".poll-submit");
        if (submit) {
          submit.onclick = () => {
            practiceVotes[p.id] = { choice: p.draft, time: Date.now() };
            store.set("poll-practice-votes", practiceVotes);
            p.lastKey = null;
            render(p);
          };
        }

        let statusHtml = '<span class="poll-chip poll-chip-practice">' + T.practiceActiveNotice + '</span> ' +
          '<span class="poll-msg">' + T.promptPractice + '</span>';
        if (s.total > 0) {
          statusHtml += ' <span class="poll-count">' + T.votes(s.total) + ' in lecture</span>';
        }
        status.innerHTML = statusHtml;

        controls.innerHTML = "";
        if (isTeacher) {
          controls.append(
            button(T.reset, () => confirm(T.confirmReset) && rpc("reset_poll", { p_poll: p.id }))
          );
        }
      }

    } else {
      // =======================================================================
      // LIVE CLASSROOM MODE (Synchronized in-class polling)
      // =======================================================================
      // Results stay hidden for everyone (presenter too, the screen may be projected) until revealed.
      const showResults = s.counts && s.revealed;
      if (p.multiple && p.draftRound !== s.round) { p.draft = my || 0; p.draftRound = s.round; }
      const picked = i => p.multiple ? !!(my & (1 << i)) : i === my;
      const key = JSON.stringify([s, my, isTeacher, p.draft, practiceMode]);
      if (key === p.lastKey) return;
      p.lastKey = key;
      p.el.classList.toggle("poll-revealed", !!showResults);
      if (p.explanation) p.explanation.hidden = !(showResults && s.revealed);

      if (showResults) {
        body.innerHTML = p.options.map((label, i) => {
          const n = p.multiple
            ? Object.entries(s.counts).reduce((a, [mask, c]) => a + (mask & (1 << i) ? c : 0), 0)
            : s.counts[i] || 0;
          const pct = s.total ? Math.round(100 * n / s.total) : 0;
          const ok = p.correct.includes(i);
          return '<div class="poll-bar' + (ok ? ' poll-correct' : '') + (picked(i) ? ' poll-mine' : '') + '">' +
            '<div class="poll-bar-fill" data-w="' + pct + '"></div>' +
            '<div class="poll-bar-label">' + (ok ? '<span class="poll-letter">✓</span>' : letter(i)) +
            '<span class="poll-bar-text">' + label + '</span>' +
            (ok ? '<span class="poll-chip poll-chip-correct">' + T.correct + '</span>' : '') +
            (picked(i) ? '<span class="poll-chip">' + T.yours + '</span>' : '') + '</div>' +
            '<div class="poll-bar-value">' + pct + '%<span>' + n + '</span></div></div>';
        }).join("");
        requestAnimationFrame(() => requestAnimationFrame(() =>
          body.querySelectorAll(".poll-bar-fill").forEach(f => f.style.width = f.dataset.w + "%")));
      } else {
        const cols = p.options.length === 4 ? 2 : Math.min(p.options.length, 3);
        const selected = i => p.multiple ? !!(p.draft & (1 << i)) : i === my;
        body.innerHTML = '<div class="poll-options' + (p.multiple ? ' poll-multi' : '') + '" style="--poll-cols:' + cols + '">' +
          p.options.map((label, i) =>
          '<button type="button" class="poll-option' + (selected(i) ? ' poll-selected' : '') +
          '" data-choice="' + i + '"' + (configured ? '' : ' disabled') + '>' + letter(i) +
          '<span class="poll-option-label">' + label + '</span>' +
          '<span class="poll-option-indicator" aria-hidden="true">' + (selected(i) ? (p.multiple ? '✓' : '●') : '') + '</span>' +
          '</button>').join("") + '</div>' +
          (p.multiple && configured ? '<button type="button" class="poll-submit"' + (p.draft ? '' : ' disabled') + '>' +
            (my ? T.update : T.submit) + '</button>' : '');
        body.querySelectorAll(".poll-option").forEach(b => b.onclick = () => {
          if (!p.multiple) return vote(p, +b.dataset.choice);
          p.draft ^= 1 << +b.dataset.choice;
          render(p);
        });
        const submit = body.querySelector(".poll-submit");
        if (submit) submit.onclick = () => vote(p, p.draft);
      }

      let msg = "";
      if (isTeacher) {
        msg = s.revealed ? T.revealedToAll : T.hidden;
      } else if (my !== null && !s.revealed) {
        msg = T.saved;
      }
      const exact = p.multiple && showResults && s.total
        ? '<span class="poll-chip poll-chip-correct">' + T.exact + ' · ' +
          Math.round(100 * (s.counts[correctMask] || 0) / s.total) + '%</span>' : '';
      status.innerHTML = '<span class="poll-count">' + T.votes(s.total) + '</span>' + exact +
        (msg ? ' <span class="poll-msg">' + msg + '</span>' : '');

      controls.innerHTML = "";
      if (isTeacher) {
        controls.append(
          button(s.revealed ? T.hide : T.reveal, async () => {
            await rpc("set_revealed", { p_poll: p.id, p_revealed: !s.revealed });
          }),
          button(T.reset, () => confirm(T.confirmReset) && rpc("reset_poll", { p_poll: p.id }))
        );
      }
    }

    if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([body]).catch(() => {});
  }

  function renderTable(t) {
    const s = t.state;
    const isTeacher = teacher && !previewAsStudent;
    const pVote = practiceVotes[t.id];
    const hasPracticed = practiceMode && pVote;

    const kicker = t.el.querySelector(".poll-kicker");
    if (kicker) {
      if (practiceMode) {
        kicker.className = "poll-kicker poll-kicker-practice";
        kicker.innerHTML = '<span class="poll-dot"></span>' + T.kickerTablePractice;
        t.el.classList.add("poll-practice");
      } else {
        kicker.className = "poll-kicker";
        kicker.innerHTML = '<span class="poll-dot"></span>' + T.kickerTable;
        t.el.classList.remove("poll-practice");
      }
    }

    if (practiceMode) {
      if (hasPracticed) {
        t.blanks.forEach((b, k) => {
          b.input.value = pVote.values[k] ?? "";
          b.input.disabled = true;
          const ok = pVote.right[k];
          b.input.classList.toggle("poll-ok", ok);
          b.input.classList.toggle("poll-bad", !ok);
          b.hint.textContent = !ok ? "→ " + fmt(b.answer) : "";
        });
        const submit = t.el.querySelector(".poll-submit");
        submit.hidden = false;
        submit.textContent = T.tryAgain;
        submit.className = "poll-submit poll-btn-retry";
        submit.onclick = () => {
          delete practiceVotes[t.id];
          store.set("poll-practice-votes", practiceVotes);
          t.blanks.forEach(b => {
            b.input.value = "";
            b.input.disabled = false;
            b.input.classList.remove("poll-ok", "poll-bad");
            b.hint.textContent = "";
          });
          t.updateTotals();
          t.lastKey = null;
          renderTable(t);
        };
        const nRight = pVote.right.filter(Boolean).length;
        const allOk = nRight === t.blanks.length;
        t.el.querySelector(".poll-status").innerHTML =
          '<span class="poll-chip poll-chip-practice">' + T.practiceActiveNotice + '</span> ' +
          '<span class="poll-chip ' + (allOk ? 'poll-chip-correct' : 'poll-chip-wrong') + '">' +
          (allOk ? T.allCorrect : nRight + "/" + t.blanks.length + " correct") + '</span>' +
          (s.total ? ' <span class="poll-count">' + T.classBenchmark(s.total) + '</span>' : '');
      } else {
        t.blanks.forEach(b => {
          b.input.disabled = false;
          b.input.classList.remove("poll-ok", "poll-bad");
          b.hint.textContent = "";
        });
        const submit = t.el.querySelector(".poll-submit");
        submit.hidden = false;
        submit.textContent = T.checkAnswers;
        submit.className = "poll-submit";
        submit.onclick = () => submitTable(t);
        t.el.querySelector(".poll-status").innerHTML =
          '<span class="poll-chip poll-chip-practice">' + T.practiceActiveNotice + '</span> ' +
          '<span class="poll-msg">' + T.promptTablePractice + '</span>';
      }
      t.el.querySelector(".poll-controls").innerHTML = "";
      if (isTeacher) {
        t.el.querySelector(".poll-controls").append(
          button(T.reset, () => confirm(T.confirmReset) && rpcAll("reset_poll", tableIds(t), id => ({ p_poll: id })))
        );
      }
      return;
    }

    // Live Classroom / Teacher view
    const stored = myVotes[t.id];
    const mineNow = stored && stored.round === s.round ? stored : null;
    const key = JSON.stringify([s, t.subs, isTeacher, !!mineNow, practiceMode]);
    if (key === t.lastKey) return;
    t.lastKey = key;

    if (t.round !== undefined && t.round !== s.round) t.blanks.forEach(b => b.input.value = "");
    if (t.round === undefined && mineNow) t.blanks.forEach((b, k) => b.input.value = mineNow.values[k] ?? "");
    t.round = s.round;
    t.updateTotals();

    t.blanks.forEach(b => {
      const v = num(b.input.value), ok = v === b.answer;
      b.input.disabled = s.revealed;
      b.input.classList.toggle("poll-ok", s.revealed && ok);
      b.input.classList.toggle("poll-bad", s.revealed && !ok);
      b.hint.textContent = s.revealed && !ok ? "→ " + fmt(b.answer) : "";
    });

    const submit = t.el.querySelector(".poll-submit");
    submit.hidden = s.revealed;
    submit.className = "poll-submit";
    submit.textContent = mineNow ? T.update : T.submit;
    submit.onclick = () => submitTable(t);

    const stats = t.el.querySelector(".poll-table-stats");
    stats.hidden = !s.revealed || !s.total;
    const pct = st => st && st.total ? Math.round(100 * ((st.counts || {})[0] || 0) / st.total) : 0;
    stats.innerHTML = '<span class="poll-chip poll-chip-correct">' + T.allCorrect + ' · ' + pct(s) + '%</span>' +
      t.blanks.map(b => '<span class="poll-chip">' + b.label + ' · ' + pct(t.subs[b.id]) + '%</span>').join("");

    let msg = "";
    if (isTeacher) {
      msg = s.revealed ? T.revealedToAll : T.hidden;
    } else if (mineNow && !s.revealed) {
      msg = T.savedTable;
    }
    t.el.querySelector(".poll-status").innerHTML = '<span class="poll-count">' + T.submissions(s.total) + '</span>' +
      (msg ? ' <span class="poll-msg">' + msg + '</span>' : '');

    const controls = t.el.querySelector(".poll-controls");
    controls.innerHTML = "";
    if (isTeacher) {
      controls.append(
        button(s.revealed ? T.hide : T.reveal, () => rpcAll("set_revealed", tableIds(t), id => ({ p_poll: id, p_revealed: !s.revealed }))),
        button(T.reset, () => confirm(T.confirmReset) && rpcAll("reset_poll", tableIds(t), id => ({ p_poll: id }))));
    }
  }

  async function submitTable(t) {
    const isTeacher = teacher && !previewAsStudent;
    const values = t.blanks.map(b => num(b.input.value));
    const status = t.el.querySelector(".poll-status");
    if (values.some(v => v === null)) { status.textContent = T.fillAll; return; }
    const right = t.blanks.map((b, k) => values[k] === b.answer);

    if (practiceMode) {
      // 100% in-browser, no database write
      practiceVotes[t.id] = { values, right, time: Date.now() };
      store.set("poll-practice-votes", practiceVotes);
      t.lastKey = null;
      renderTable(t);
      return;
    }

    const results = await Promise.all([
      db.rpc("cast_vote", { p_poll: t.id, p_voter: voter, p_choice: right.every(Boolean) ? 0 : 1 })
    ].concat(t.blanks.map((b, k) =>
      db.rpc("cast_vote", { p_poll: b.id, p_voter: voter, p_choice: right[k] ? 0 : 1 }))));
    if (results.some(r => r.error)) { status.textContent = T.error; return; }
    myVotes[t.id] = { round: results[0].data, values };
    store.set("poll-votes", myVotes);
    t.lastKey = null;
    refresh();
  }

  function renderCalc(c) {
    const s = c.state;
    const isTeacher = teacher && !previewAsStudent;
    const pVote = practiceVotes[c.id];
    const hasPracticed = practiceMode && pVote;

    const kicker = c.el.querySelector(".poll-kicker");
    if (kicker) {
      if (practiceMode) {

        kicker.innerHTML = '<span class="poll-dot"></span>' + T.kickerCalc;
        c.el.classList.remove("poll-practice");

    }

    if (practiceMode) {
      if (hasPracticed) {
        c.fields.forEach((f, k) => {
          f.input.value = pVote.values[k] ?? "";

          const got = pVote.got[k];
          f.input.classList.toggle("poll-ok", got === 0);

          f.hint.textContent = got !== 0 ? "→ " + withUnit(f) : "";

        submit.className = "poll-submit poll-btn-retry";

            f.input.disabled = false;
            f.input.classList.remove("poll-ok", "poll-bad");
            f.hint.textContent = "";
            f.feedback.textContent = "";
          });
          c.lastKey = null;
          renderCalc(c);
        };
        const allOk = pVote.got.every(g => g === 0);
        c.el.querySelector(".poll-status").innerHTML =
          '<span class="poll-chip poll-chip-practice">' + T.practiceActiveNotice + '</span> ' +

      } else {
        c.fields.forEach(f => {
          f.input.disabled = false;
          f.input.classList.remove("poll-ok", "poll-bad");
          f.hint.textContent = "";
          f.feedback.textContent = "";
        });
        const submit = c.el.querySelector(".poll-submit");

        submit.textContent = T.checkAnswers;
        submit.className = "poll-submit";
        submit.onclick = () => submitCalc(c);
        c.el.querySelector(".poll-status").innerHTML =
          '<span class="poll-chip poll-chip-practice">' + T.practiceActiveNotice + '</span> ' +
          '<span class="poll-msg">' + T.promptCalcPractice + '</span>';
      }
      c.el.querySelector(".poll-controls").innerHTML = "";
      if (isTeacher) {
        c.el.querySelector(".poll-controls").append(
          button(T.reset, () => confirm(T.confirmReset) && rpcAll("reset_poll", calcIds(c), id => ({ p_poll: id })))
        );
      }
      return;
    }

    // Live Classroom / Teacher view
    const stored = myVotes[c.id];
    const mineNow = stored && stored.round === s.round ? stored : null;
    const key = JSON.stringify([s, c.subs, isTeacher, !!mineNow, practiceMode]);
    if (key === c.lastKey) return;
    c.lastKey = key;

    if (c.round !== undefined && c.round !== s.round) c.fields.forEach(f => f.input.value = "");

      f.input.classList.toggle("poll-ok", s.revealed && got === 0);
      f.input.classList.toggle("poll-bad", s.revealed && got !== 0);
      f.hint.textContent = s.revealed && got !== 0 ? "→ " + withUnit(f) : "";
      f.feedback.textContent = s.revealed && got > 0 && got <= f.mistakes.length ? f.mistakes[got - 1].label : "";
      f.stats.hidden = !showStats;
      if (!showStats) return;
      const st = c.subs[f.id] || {}, counts = st.counts || {}, n = st.total || 0;
      const rows = ["✓ " + withUnit(f)].concat(f.mistakes.map(m => m.label), T.other);
      f.stats.innerHTML = rows.map((label, i) => {

          '<div class="poll-bar-value">' + pct + '%<span>' + (counts[i] || 0) + '</span></div></div>';
      }).join("");

    requestAnimationFrame(() => requestAnimationFrame(() =>
      c.el.querySelectorAll(".poll-bar-fill").forEach(b => b.style.width = b.dataset.w + "%")));

    const submit = c.el.querySelector(".poll-submit");
    submit.hidden = s.revealed;

    stats.innerHTML = '<span class="poll-chip poll-chip-correct">' + T.allCorrect + ' · ' +

    let msg = "";
    if (isTeacher) {

    } else if (mineNow && !s.revealed) {
      msg = T.savedTable;
    }
    c.el.querySelector(".poll-status").innerHTML = '<span class="poll-count">' + T.submissions(s.total) + '</span>' +
      (msg ? ' <span class="poll-msg">' + msg + '</span>' : '');

    const controls = c.el.querySelector(".poll-controls");
    controls.innerHTML = "";
    if (isTeacher) {
      controls.append(
        button(s.revealed ? T.hide : T.reveal, () => rpcAll("set_revealed", calcIds(c), id => ({ p_poll: id, p_revealed: !s.revealed }))),
        button(T.reset, () => confirm(T.confirmReset) && rpcAll("reset_poll", calcIds(c), id => ({ p_poll: id }))));
    }
  }

  async function submitCalc(c) {
    const isTeacher = teacher && !previewAsStudent;
    const values = c.fields.map(f => f.input.value.trim());
    const got = c.fields.map(f => classify(f, f.input.value));
    const status = c.el.querySelector(".poll-status");
    if (got.some(g => g === null)) { status.textContent = T.fillNumbers; return; }

    if (practiceMode) {
      // 100% in-browser, no database write
      practiceVotes[c.id] = { values, got, time: Date.now() };
      store.set("poll-practice-votes", practiceVotes);
      c.lastKey = null;
      renderCalc(c);
      return;
    }

    const results = await Promise.all([
      db.rpc("cast_vote", { p_poll: c.id, p_voter: voter, p_choice: got.every(g => g === 0) ? 0 : 1 })
    ].concat(c.fields.map((f, k) =>
      db.rpc("cast_vote", { p_poll: f.id, p_voter: voter, p_choice: got[k] }))));
    if (results.some(r => r.error)) { status.textContent = T.error; return; }
    myVotes[c.id] = { round: results[0].data, values };
    store.set("poll-votes", myVotes);
    c.lastKey = null;
    refresh();
  }

  async function rpcAll(name, ids, args) {
    const results = await Promise.all(ids.map(id => db.rpc(name, args(id))));
    const err = results.find(r => r.error);
    if (err) alert(T.error + "\n" + err.error.message);
    await refresh();
  }

  function button(label, onclick) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "poll-control"; b.textContent = label; b.onclick = onclick;
    return b;
  }

  async function vote(p, choice) {
    const { data, error } = await db.rpc("cast_vote", { p_poll: p.id, p_voter: voter, p_choice: choice });
    if (error) { p.el.querySelector(".poll-status").textContent = T.error; return; }
    myVotes[p.id] = { round: data, choice };
    store.set("poll-votes", myVotes);
    refresh();
  }

  async function rpc(name, args) {
    const { error } = await db.rpc(name, args);
    if (error) alert(T.error + "\n" + error.message);
    await refresh();
  }

  // Toggle page mode: switches between Live Classroom and Practice Mode for all polls
  async function togglePageMode() {
    const nextMode = !practiceMode;
    // 1. Update session in polls table
    await db.rpc("set_revealed", { p_poll: pageSessionId, p_revealed: nextMode });

    // 2. Cast session vote so old unmigrated poll_results RPC with inner join also finds it
    if (nextMode) {
      await db.rpc("cast_vote", { p_poll: pageSessionId, p_voter: voter, p_choice: 0 });
    }

    // 3. Update all polls on the page in parallel
    const updateIds = allIds();
    await Promise.all(updateIds.map(id => db.rpc("set_revealed", { p_poll: id, p_revealed: nextMode })));

    practiceMode = nextMode;
    await refresh();
    drawPresenterUi();
  }

  async function resetAllPolls() {
    if (!confirm(T.confirmResetAll)) return;
    await db.rpc("set_revealed", { p_poll: pageSessionId, p_revealed: false });
    await Promise.all(allIds().map(id => db.rpc("reset_poll", { p_poll: id })));
    practiceMode = false;
    await refresh();
    drawPresenterUi();
  }

  function drawPresenterDock() {
    const oldBar = document.getElementById("poll-praktikum-bar");
    if (oldBar) oldBar.remove();

    updatePreviewBanner();

    const show = teacher && !previewAsStudent && !!(polls.length || tables.length || calcs.length);
    if (!show) {
      if (presenterDock) presenterDock.style.display = "none";
      return;
    }

    if (!presenterDock) {
      presenterDock = document.createElement("div");
      presenterDock.id = "poll-presenter-dock";
      document.body.appendChild(presenterDock);
    }

    presenterDock.style.display = "flex";
    presenterDock.className = "poll-presenter-dock" + (practiceMode ? " practice-mode" : "") + (dockMinimized ? " minimized" : "");

    const label = getPracticalLabel();

    if (dockMinimized) {
      presenterDock.innerHTML = `
        <button type="button" class="poll-dock-min-btn ${practiceMode ? 'poll-mode-practice' : 'poll-mode-live'}" title="Expand Presenter Controls for ${label.full} (${practiceMode ? 'Practice Mode' : 'Live Classroom'})">
          <span class="poll-dock-dot"></span>
          <span class="poll-dock-min-text">${label.short}</span>
        </button>
      `;
      presenterDock.querySelector(".poll-dock-min-btn").onclick = () => {
        dockMinimized = false;

    presenterDock.innerHTML = `
      <div class="poll-dock-capsule">

        <div class="poll-dock-indicator ${practiceMode ? 'poll-mode-practice' : 'poll-mode-live'}" title="${label.full}: ${practiceMode ? 'Self-study: instant local evaluation, 0 DB writes' : 'Live: students vote into classroom dataset'}">
          <span class="poll-dock-dot"></span>
          <span class="poll-dock-status-label">${label.full}: ${practiceMode ? 'Practice' : 'Live'}</span>
        </div>
        <div class="poll-dock-sep"></div>
        <button type="button" class="poll-dock-toggle-btn" title="Toggle ${label.full} between Live Classroom and Practice Mode (other practicals remain unaffected)">
          ${practiceMode ? 'Set ' + label.short + ' to Live' : 'Set ' + label.short + ' to Practice'}
        </button>
        <div class="poll-dock-sep"></div>
        <button type="button" class="poll-dock-icon-btn poll-dock-csv" title="Export CSV for ${label.full}">📊 CSV</button>
        <button type="button" class="poll-dock-icon-btn poll-dock-reset" title="${label.full}: ${T.resetAll}">↺</button>
        <button type="button" class="poll-dock-icon-btn poll-dock-min" title="Minimize toolbar">—</button>
      </div>

    const toggleBtn = presenterDock.querySelector(".poll-dock-toggle-btn");
    if (toggleBtn) toggleBtn.onclick = togglePageMode;

    const minBtn = presenterDock.querySelector(".poll-dock-min");
    if (minBtn) {
      minBtn.onclick = () => {
        dockMinimized = true;
        store.set("poll-dock-min", true);
        drawPresenterDock();
      };
    }
  }

  async function refresh() {
    if (!polls.length && !tables.length && !calcs.length) return;
    const queryIds = [pageSessionId].concat(allIds());
    const byId = {};

    // 1. Fetch live RPC results
    const { data, error } = await db.rpc("poll_results", { p_polls: queryIds });
    if (!error && data) {
      data.forEach(r => {
        const s = byId[r.poll_id] ||= { round: r.round, revealed: r.revealed, counts: null, total: 0 };
        s.round = r.round;
        s.revealed = r.revealed;
        if (r.choice === null) {
          s.total = Number(r.n);
        } else {
          (s.counts ||= {})[r.choice] = Number(r.n);
        }
      });
      // One vote per voter and poll, so the counts add up to the total. The live DB sometimes
      // omits the total row for revealed polls (→ "0 votes", 0 %), so never trust it below the sum.
      Object.values(byId).forEach(s => {
        if (s.counts) s.total = Math.max(s.total, Object.values(s.counts).reduce((a, n) => a + n, 0));
      });
    }

    // 2. Fetch authoritative poll state from polls table directly (handles 0-vote polls under RLS)
    try {
      const { data: pollRows } = await db.from("polls").select("id, round, revealed").in("id", queryIds);
      if (pollRows) {
        pollRows.forEach(r => {
          const s = byId[r.id] ||= { round: r.round, revealed: r.revealed, counts: null, total: 0 };
          s.round = r.round;
          s.revealed = r.revealed;
        });
      }
    } catch (e) {}

    // Check practice mode from session row
    if (byId[pageSessionId]) {
      practiceMode = !!byId[pageSessionId].revealed;
    }

    polls.forEach(p => {
      const s = byId[p.id] || { round: p.state.round, revealed: false, counts: null, total: 0 };
      if (!s.counts && (s.revealed || (teacher && !previewAsStudent))) s.counts = {};
      p.state = s;
      render(p);
    });
    const empty = { round: 1, revealed: false, counts: null, total: 0 };
    tables.forEach(t => {
      t.state = byId[t.id] || { ...empty, round: t.state.round };
      t.subs = Object.fromEntries(t.blanks.map(b => [b.id, byId[b.id] || empty]));
      renderTable(t);
    });
    calcs.forEach(c => {
      c.state = byId[c.id] || { ...empty, round: c.state.round };
      c.subs = Object.fromEntries(c.fields.map(f => [f.id, byId[f.id] || empty]));
      renderCalc(c);
    });
    // Elements with class .presenter-only[data-reveal-with]: unlock in practice mode or when revealed
    document.querySelectorAll(".presenter-only[data-reveal-with]").forEach(el => {
      const isRev = practiceMode || !!(byId[el.dataset.revealWith] || {}).revealed;
      el.classList.toggle("poll-unlocked", isRev);
    });

    drawPresenterDock();
    if (navBadge) {
      const hasPolls = !!(polls.length || tables.length || calcs.length);
      if (teacher && !previewAsStudent && hasPolls) {
        const label = getPracticalLabel();
        navBadge.style.display = "inline-flex";
        navBadge.className = "poll-navbar-badge " + (practiceMode ? "poll-mode-practice" : "poll-mode-live");
        navBadge.innerHTML = '<span class="poll-nav-dot"></span><span class="poll-nav-label">' +
          label.short + ' · ' + (practiceMode ? "Practice" : "Live") + '</span>';
        navBadge.title = `${label.full}: ${practiceMode ? 'Practice Mode' : 'Live Classroom'} (Click to open Presenter Menu)`;
      } else {
        navBadge.style.display = "none";
      }
    }
  }

  let drawPresenterUi = () => {};
  let navBadge = null;

  // Persistent Presenter Toolbar in navbar (gear icon always visible)
  async function setupPresenter() {
    const wrap = document.createElement("div");
    wrap.className = "poll-presenter";
    const toggle = document.createElement("button");
    toggle.type = "button"; toggle.className = "poll-presenter-toggle"; toggle.title = T.presenter;
    toggle.textContent = "⚙";
    toggle.onclick = () => wrap.classList.toggle("open");
    const bar = document.createElement("div");
    bar.className = "poll-presenter-bar";
    wrap.append(bar);
    document.body.append(wrap);
    const tools = document.querySelector(".quarto-navbar-tools");
    if (tools) {
      navBadge = document.createElement("button");
      navBadge.type = "button";
      navBadge.className = "poll-navbar-badge";
      navBadge.style.display = "none";
      navBadge.onclick = () => wrap.classList.toggle("open");
      tools.prepend(toggle);
      tools.prepend(navBadge);
    } else {
      wrap.append(toggle);
    }

    drawPresenterUi = async function () {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        const { data } = await db.rpc("is_teacher");
        teacher = !!data;
        const label = getPracticalLabel();

        let html = '<div class="poll-presenter-row poll-presenter-top">' +
          '<strong>' + T.presenter + '</strong> ' +
          '<span class="poll-presenter-email">' + session.user.email + '</span>' +
          (teacher ? '' : ' <span class="poll-warning">' + T.notTeacher + '</span>') +
          '</div>';

        if (teacher) {
          html += '<div class="poll-presenter-row poll-presenter-mode-row">' +
            '<div class="poll-mode-status">' +
            '<strong>' + label.full + ':</strong> <span class="poll-mode-badge ' + (practiceMode ? 'poll-mode-practice' : 'poll-mode-live') + '">' +
            '<span class="poll-nav-dot"></span> ' + (practiceMode ? 'Practice Mode' : 'Live Classroom') +
            '</span></div>' +
            '<button type="button" class="poll-control poll-btn-mode-toggle">' +
            (practiceMode ? 'Set ' + label.short + ' to Live' : 'Set ' + label.short + ' to Practice') + '</button>' +
            '</div>' +
            '<div class="poll-mode-scope-hint">' +
            '<span>🎯 <strong>Independent Scope:</strong> Mode is stored per practical. Setting ' + label.full + ' to Practice leaves all other practicals untouched.</span>' +
            '</div>';

          html += '<div class="poll-presenter-row poll-presenter-actions">' +
            '<label class="poll-presenter-preview"><input type="checkbox" id="poll-preview-chk"' +
            (previewAsStudent ? ' checked' : '') + '> ' + T.previewStudent + '</label>' +
            '<button type="button" class="poll-control" id="poll-btn-csv">' + T.csv + '</button>' +
            '<button type="button" class="poll-control poll-btn-danger" id="poll-btn-reset-all">' + T.resetAll + '</button>' +
            '<button type="button" class="poll-control" id="poll-btn-logout">' + T.logout + '</button>' +
            '</div>';
        } else {
          html += '<div class="poll-presenter-row"><button type="button" class="poll-control" id="poll-btn-logout">' + T.logout + '</button></div>';
        }

        bar.innerHTML = html;

        if (teacher) {
          const modeBtn = bar.querySelector(".poll-btn-mode-toggle");
          if (modeBtn) modeBtn.onclick = togglePageMode;

          const chk = bar.querySelector("#poll-preview-chk");
          if (chk) {
            chk.onchange = () => {
              previewAsStudent = chk.checked;
              wrap.classList.remove("open");
              drawPresenterDock();
              refresh();
            };
          }

          const csvBtn = bar.querySelector("#poll-btn-csv");
          if (csvBtn) csvBtn.onclick = exportCsv;

          const resetAllBtn = bar.querySelector("#poll-btn-reset-all");
          if (resetAllBtn) resetAllBtn.onclick = resetAllPolls;
        }

        const logoutBtn = bar.querySelector("#poll-btn-logout");
        if (logoutBtn) {
          logoutBtn.onclick = async () => {
            await db.auth.signOut();
            teacher = false;
            previewAsStudent = false;
            drawPresenterUi();
            drawPresenterDock();
            refresh();
          };
        }
      } else {
        teacher = false;
        previewAsStudent = false;
        bar.innerHTML = "<strong>" + T.presenter + "</strong>" +
          '<form><input type="email" placeholder="' + T.email + '" required>' +
          '<input type="password" placeholder="' + T.password + '" required>' +
          '<button type="submit" class="poll-control">' + T.login + "</button></form>";
        bar.querySelector("form").onsubmit = async e => {
          e.preventDefault();
          const [email, password] = Array.from(e.target.querySelectorAll("input")).map(i => i.value);
          const { error } = await db.auth.signInWithPassword({ email, password });
          if (error) alert(error.message);
          drawPresenterUi();
        };
      }
      document.documentElement.classList.toggle("poll-teacher", teacher && !previewAsStudent);

      if (navBadge) {
        const hasPolls = !!(polls.length || tables.length || calcs.length);
        if (teacher && !previewAsStudent && hasPolls) {
          const label = getPracticalLabel();
          navBadge.style.display = "inline-flex";
          navBadge.className = "poll-navbar-badge " + (practiceMode ? "poll-mode-practice" : "poll-mode-live");
          navBadge.innerHTML = '<span class="poll-nav-dot"></span><span class="poll-nav-label">' +
            label.short + ' · ' + (practiceMode ? "Practice" : "Live") + '</span>';
          navBadge.title = `${label.full}: ${practiceMode ? 'Practice Mode' : 'Live Classroom'} (Click to open Presenter Menu)`;
        } else {
          navBadge.style.display = "none";
        }
      }

      drawPresenterDock();
      refresh();
    };

    drawPresenterUi();
  }

  async function exportCsv() {
    const { data, error } = await db.from("votes")
      .select("poll_id, round, choice, created_at")
      .in("poll_id", allIds())
      .order("created_at");
    if (error) { alert(T.error + "\n" + error.message); return; }
    const text = html => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.trim(); };
    const labels = Object.fromEntries(polls.map(p => [p.id, p.multiple
      ? Array.from({ length: 1 << p.options.length }, (_, m) =>
          p.options.map(text).filter((_, i) => m & (1 << i)).join(" + "))
      : p.options.map(text)]));
    tables.forEach(t => {
      labels[t.id] = ["all correct", "not all correct"];
      t.blanks.forEach(b => labels[b.id] = [b.label + ": correct", b.label + ": wrong"]);
    });
    calcs.forEach(c => {
      labels[c.id] = ["all correct", "not all correct"];
      c.fields.forEach(f => labels[f.id] = [f.text + ": correct"]
        .concat(f.mistakes.map(m => f.text + ": " + m.label), f.text + ": other"));
    });
    const q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const rows = [["poll", "round", "choice", "answer", "time"]].concat(data.map(r =>
      [r.poll_id, r.round, r.choice, (labels[r.poll_id] || [])[r.choice] ?? "", r.created_at]));
    const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "poll-votes-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
  }

  polls.forEach(render);
  tables.forEach(renderTable);
  calcs.forEach(renderCalc);
  setupPresenter();
  if (polls.length || tables.length || calcs.length) {
    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  }
})();
</script>
